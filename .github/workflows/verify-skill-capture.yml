name: Build and verify Windows guide collector

on:
  push:
    branches: [main]
    paths:
      - 'tools/skill-capture/**'
      - 'scripts/package_skill_capture.py'
      - 'public/downloads/steam-skill-capture-windows.zip'
      - 'public/downloads/rivals-guide-capture-windows.zip'
      - '.github/workflows/verify-skill-capture.yml'
  pull_request:
    paths:
      - 'tools/skill-capture/**'
      - 'scripts/package_skill_capture.py'
      - 'public/downloads/steam-skill-capture-windows.zip'
      - 'public/downloads/rivals-guide-capture-windows.zip'
      - '.github/workflows/verify-skill-capture.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r tools/skill-capture/requirements.txt
      - run: python -m unittest discover -s tools/skill-capture -p "test_*.py" -v
      - name: Open and close the capture UI without game input
        working-directory: tools/skill-capture
        run: python -c "import tkinter as tk; from app import App; from windows_backend import enable_dpi_awareness; enable_dpi_awareness(); root = tk.Tk(); app = App(root); root.update(); root.destroy()"
      - name: Verify the downloadable ZIP matches source
        shell: python
        run: |
          from pathlib import Path
          import subprocess
          import zipfile
          target = Path('public/downloads/steam-skill-capture-windows.zip')
          def contents():
              with zipfile.ZipFile(target) as archive:
                  assert archive.testzip() is None
                  return {name: archive.read(name) for name in archive.namelist()}
          before = contents()
          subprocess.run(['python', 'scripts/package_skill_capture.py'], check=True)
          assert contents() == before, 'Regenerate the Windows download ZIP'

      - name: Build standalone Windows GUI
        working-directory: tools/skill-capture
        run: |
          python -m pip install pyinstaller==6.16.0
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name RivalsGuideCollector --add-data "windows_ocr.ps1;." --add-data "skill_names.json;." app.py
      - name: Check executable starts without Python installation
        shell: pwsh
        run: |
          $process = Start-Process -FilePath tools/skill-capture/dist/RivalsGuideCollector.exe -PassThru
          Start-Sleep -Seconds 8
          if ($process.HasExited) { throw "GUI executable exited unexpectedly" }
          Stop-Process -Id $process.Id
      - uses: actions/upload-artifact@v4
        with:
          name: RivalsGuideCollector-Windows
          path: |
            tools/skill-capture/dist/RivalsGuideCollector.exe
            tools/skill-capture/GUI_README.md
            tools/skill-capture/README.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: guide-collector-preview
          path: tools/skill-capture/gui-preview.png
          if-no-files-found: ignore

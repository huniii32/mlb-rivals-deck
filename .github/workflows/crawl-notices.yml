name: Crawl Notices

on:
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:

concurrency:
  group: notices-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check notice parsers
        run: python3 -m unittest discover -s scripts -p test_notice_sync.py
      - name: Sync listings, Rival Pick rounds and developer skill notices
        id: sync
        continue-on-error: true
        run: python3 scripts/fetch_notices_ko.py
      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -- src/data/noticeSyncPending.json src/data/notices.json src/data/officialSkillChanges.json src/data/rivalPickRounds.json src/data/rivalsSeries-20261119.json
          if test -d src/data/rival-rounds; then git add -- src/data/rival-rounds; fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data: 공지 자동 갱신"
          git pull --rebase
          git push
      - name: Report sources to retry
        if: steps.sync.outcome == 'failure'
        run: exit 1

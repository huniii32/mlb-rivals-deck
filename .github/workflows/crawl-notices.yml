name: Crawl Notices

on:
  schedule:
    # 09:00 / 15:00 KST = 00:00 / 06:00 UTC
    - cron: "0 0,6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch latest ko notices (new items only)
        run: python3 scripts/fetch_notices_ko.py
      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/notices.json
          git diff --cached --quiet || git commit -m "data: 공지 자동 갱신"
          git push
